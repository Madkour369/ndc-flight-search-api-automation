name: API Test Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run FlightSearch API test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `clean test` (not a bare `test`) so target/allure-results starts
      # empty on every run -- otherwise a self-hosted/cached runner could
      # carry over stale results from a previous run and double-count them
      # in both the Allure report and the executive HTML report below.
      - name: Run TestNG suite
        env:
          NDC_API_KEY: ${{ secrets.NDC_API_KEY }}
          NDC_CLIENT_ID: ${{ secrets.NDC_CLIENT_ID }}
        run: mvn -B clean test

      - name: Generate executive QA report
        if: always()
        run: node .agent/skills/ndc-api-reporter/generate_report.js

      - name: Upload Execution QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-qa-report
          path: Execution_QA_Report.html
          retention-days: 30

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 30

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 30
