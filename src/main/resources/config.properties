# Framework-level configuration — base URL and the Client-Id header only.
# These are the only two things every endpoint module shares; anything
# endpoint-specific (e.g. FlightSearch's default supplier/credentialsSelector)
# belongs in that module's own test data, not here.
#
# Any key can be overridden per-run with a matching -D system property, e.g.
#   mvn test -Dapi.baseUri=https://staging.example.com
#
# api.key is intentionally NOT set here — it's a secret. Supply it via
# -Dapi.key=<key> or the API_KEY environment variable. See ConfigManager.
api.baseUri=https://ndc-supplier-integration.azurewebsites.net
api.clientId=NDC-Core
